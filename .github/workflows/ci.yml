name: Langulus::Logger CI
on: push
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-vs2026-arm]
        build: [debug, release]
        cxx: [g++-14, clang++-21, clangcl, emcc] # v143 suppport has been dropped indefinitely due to too many compiler bugs and bad C++23 support. tested on v145, too - not there yet. clangcl is 100% viable alternative (and 10x faster)
        arch: [x86, x64, ARM, ARM64]

        exclude:
          - cxx: emcc
            arch: x64
          - cxx: emcc
            arch: ARM64

          - os: ubuntu-24.04
            cxx: v143
          - os: ubuntu-24.04
            cxx: clangcl
          - os: ubuntu-24.04
            arch: ARM
          - os: ubuntu-24.04
            arch: ARM64

          - os: ubuntu-24.04-arm
            cxx: v143
          - os: ubuntu-24.04-arm
            cxx: clangcl
          - os: ubuntu-24.04-arm
            arch: x86
          - os: ubuntu-24.04-arm
            arch: x64

          - os: windows-2025
            cxx: g++-14
          - os: windows-2025
            arch: ARM
          - os: windows-2025
            arch: ARM64
          - os: windows-2025
            cxx: clang++-21

          - os: windows-11-vs2026-arm
            cxx: g++-14
          - os: windows-11-vs2026-arm
            arch: x86
          - os: windows-11-vs2026-arm
            arch: x64
          - os: windows-11-vs2026-arm
            cxx: clang++-21

        include:
          - cxx: emcc
            c: emcc
          - cxx: g++-14
            c: gcc-14
          - cxx: clang++-21
            c: clang-21

          - os: ubuntu-24.04
            arch: x86
            cmake_args: "-DCMAKE_CXX_FLAGS=-m32"
          - os: ubuntu-24.04-arm
            arch: ARM
            cmake_args: "-DCMAKE_CXX_FLAGS=-march=armv7"
          - os: ubuntu-24.04
            arch: x64
            cmake_args: "-DCMAKE_CXX_FLAGS=-m64"
          - os: ubuntu-24.04-arm
            arch: ARM64
            cmake_args: "-DCMAKE_CXX_FLAGS=-march=native"

          - os: windows-2025
            arch: x86
            cmake_args: "-G \"Visual Studio 18 2026\" -A Win32"
          - os: windows-2025
            arch: x64
            cmake_args: "-G \"Visual Studio 18 2026\" -A x64"

          - os: windows-11-vs2026-arm
            arch: ARM
            cmake_args: "-G \"Visual Studio 18 2026\" -A ARM"
          - os: windows-11-vs2026-arm
            arch: ARM64
            cmake_args: "-G \"Visual Studio 18 2026\" -A ARM64"

          - build: debug
            debug_flags: "-DLANGULUS_OPTION_SAFE_MODE=ON"

    name: "${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}"
    runs-on: ${{matrix.os}}
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - if: matrix.os == 'ubuntu-24.04' && (matrix.arch == 'x86' || matrix.arch == 'ARM') && matrix.cxx != 'emcc'
        name: Prepare for cross-compilation (Linux)
        run: |
          sudo apt update
          sudo apt install g++-14-multilib

      - if: matrix.os == 'ubuntu-24.04' && matrix.cxx == 'emcc'
        name: Prepate environment (Linux with emscripten)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git pull
          ./emsdk install latest
          ./emsdk activate latest

      - if: matrix.cxx == 'clang++-21'
        name: Installing Clang 21 (Linux)
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install clang-21

      - if: matrix.os == 'ubuntu-24.04' && matrix.cxx != 'emcc'
        name: Configure (Linux)
        run: >
          mkdir build && cd build && cmake ..
          -DCMAKE_C_COMPILER=${{matrix.c}}
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}}
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{github.ref_name}}-${{github.sha}}\"
          -DLANGULUS_OPTION_TESTING=ON
          ${{matrix.debug_flags}}

      - if: matrix.os == 'ubuntu-24.04' && matrix.cxx == 'emcc'
        name: Configure (Linux with emscripten)
        run: >
          source "/home/runner/work/Logger/Logger/emsdk/emsdk_env.sh" && mkdir build && cd build && emcmake cmake ..
          -DCMAKE_C_COMPILER=${{matrix.c}}
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}}
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{github.ref_name}}-${{github.sha}}\"
          -DLANGULUS_OPTION_TESTING=ON
          ${{matrix.debug_flags}}

      - if: matrix.os == 'windows-2025' && matrix.cxx == 'emcc'
        name: Prepate environment (Windows with emscripten)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git pull
          ./emsdk.bat install latest
          ./emsdk.bat activate latest --permanent

      - if: matrix.os == 'windows-2025' && matrix.cxx != 'emcc'
        name: Configure (Windows with Visual Studio)
        run: >
          mkdir build && cd build && cmake ..
          ${{matrix.cmake_args}} -T "${{matrix.cxx}}"
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{github.ref_name}}-${{github.sha}}\"
          -DLANGULUS_OPTION_TESTING=ON
          ${{matrix.debug_flags}}

      - if: matrix.os == 'windows-2025' && matrix.cxx == 'emcc'
        name: Configure (Windows with emscripten)
        run: >
          mkdir build && cd build && python D:\a\Logger\Logger\emsdk\upstream\emscripten\emcmake.py cmake ..
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{github.ref_name}}-${{github.sha}}\"
          -DLANGULUS_OPTION_TESTING=ON
          ${{matrix.debug_flags}}

      - name: Build
        run: cmake --build build --config ${{matrix.build}}

      - name: Test
        run: cd build && ctest -V -C ${{matrix.build}}
        timeout-minutes: 10

      - name: 'Upload artifacts'
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: "artifacts-langulus-logger-${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}-${{github.ref_name}}-${{github.sha}}"
          path: |
            build/bin/*.txt
            build/bin/*.htm
          retention-days: 7